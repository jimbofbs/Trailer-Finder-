<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trailer Finder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #f0f0f0;
    font-family: 'Courier New', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    background: #111;
    border-bottom: 2px solid #f5a623;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  #header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f5a623;
  }

  #setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 24px;
  }

  #setup p {
    color: #888;
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
  }

  #target-input {
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 8px;
    color: #f0f0f0;
    font-family: 'Courier New', monospace;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 8px;
    padding: 16px 20px;
    text-align: center;
    width: 100%;
    max-width: 320px;
    outline: none;
    transition: border-color 0.2s;
  }

  #target-input:focus {
    border-color: #f5a623;
  }

  #target-input::placeholder {
    color: #444;
    letter-spacing: 4px;
    font-size: 24px;
  }

  #start-btn {
    background: #f5a623;
    border: none;
    border-radius: 8px;
    color: #0a0a0a;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 16px 40px;
    text-transform: uppercase;
    transition: background 0.2s, transform 0.1s;
    width: 100%;
    max-width: 320px;
  }

  #start-btn:active { transform: scale(0.97); }
  #start-btn:hover { background: #ffc14a; }
  #start-btn:disabled { background: #444; color: #666; cursor: not-allowed; }

  #scanner {
    display: none;
    flex-direction: column;
    flex: 1;
    position: relative;
  }

  #video {
    width: 100%;
    flex: 1;
    object-fit: cover;
    background: #000;
  }

  #canvas { display: none; }

  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
  }

  #target-badge {
    background: rgba(0,0,0,0.75);
    border: 2px solid #f5a623;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #f5a623;
    text-align: center;
  }

  #target-badge span {
    display: block;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
  }

  #scan-box {
    width: 80%;
    max-width: 340px;
    height: 100px;
    border: 2px solid rgba(245, 166, 35, 0.6);
    border-radius: 6px;
    position: relative;
  }

  #scan-box::before, #scan-box::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: #f5a623;
    border-style: solid;
  }
  #scan-box::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
  #scan-box::after  { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

  #scan-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #f5a623, transparent);
    animation: scan 2s linear infinite;
  }

  @keyframes scan {
    0%   { top: 0; opacity: 1; }
    90%  { top: calc(100% - 2px); opacity: 1; }
    100% { top: calc(100% - 2px); opacity: 0; }
  }

  #status-bar {
    background: rgba(0,0,0,0.8);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #888;
    text-align: center;
    width: 100%;
  }

  #status-bar.reading { color: #f5a623; }
  #status-bar.found   { color: #2ecc71; }

  #bottom-controls {
    background: #111;
    border-top: 2px solid #222;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #detected-numbers {
    flex: 1;
    background: #1a1a1a;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
    min-height: 40px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .detected-num {
    background: #222;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 13px;
    color: #aaa;
    letter-spacing: 2px;
  }

  .detected-num.match {
    background: #1a4a2a;
    color: #2ecc71;
    border: 1px solid #2ecc71;
    font-weight: 700;
    animation: pulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes pulse {
    from { box-shadow: 0 0 0 0 rgba(46,204,113,0.4); }
    to   { box-shadow: 0 0 0 8px rgba(46,204,113,0); }
  }

  #stop-btn {
    background: #2a1a1a;
    border: 2px solid #c0392b;
    border-radius: 6px;
    color: #c0392b;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 8px 14px;
    text-transform: uppercase;
  }

  /* FOUND overlay */
  #found-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(46, 204, 113, 0.15);
    border: 6px solid #2ecc71;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    animation: foundFlash 0.3s ease-in-out;
  }

  @keyframes foundFlash {
    0%, 100% { background: rgba(46,204,113,0.15); }
    50%       { background: rgba(46,204,113,0.4); }
  }

  #found-overlay h2 {
    font-size: 48px;
    font-weight: 900;
    color: #2ecc71;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(46,204,113,0.8);
    animation: foundPulse 0.6s ease-in-out infinite alternate;
  }

  @keyframes foundPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.05); }
  }

  #found-overlay p {
    font-size: 20px;
    color: #fff;
    letter-spacing: 6px;
  }

  #dismiss-btn {
    margin-top: 16px;
    background: #2ecc71;
    border: none;
    border-radius: 8px;
    color: #0a0a0a;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 14px 32px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="header">
  <h1>🚛 Trailer Finder</h1>
</div>

<!-- Setup screen -->
<div id="setup">
  <p>ENTER THE 6-DIGIT TRAILER NUMBER<br>YOU'RE LOOKING FOR</p>
  <input
    id="target-input"
    type="text"
    inputmode="numeric"
    maxlength="6"
    placeholder="000000"
    autocomplete="off"
  />
  <button id="start-btn" disabled>START SCANNING</button>
  <p style="font-size:11px; color:#555; max-width:280px; text-align:center; line-height:1.6">
    Point your phone at trailer numbers as you drive down the row. The app will alert you when it finds a match.
  </p>
</div>

<!-- Scanner screen -->
<div id="scanner">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <div id="target-badge">
      LOOKING FOR
      <span id="target-display"></span>
    </div>
    <div id="scan-box">
      <div id="scan-line"></div>
    </div>
    <div id="status-bar">INITIALIZING OCR...</div>
  </div>
</div>

<div id="bottom-controls" style="display:none">
  <div id="detected-numbers"><span style="color:#444">No numbers detected yet</span></div>
  <button id="stop-btn">STOP</button>
</div>

<!-- Found overlay -->
<div id="found-overlay">
  <h2>FOUND IT!</h2>
  <p id="found-number"></p>
  <button id="dismiss-btn">KEEP SCANNING</button>
</div>

<audio id="beep-audio" preload="auto"></audio>

<script>
  const targetInput  = document.getElementById('target-input');
  const startBtn     = document.getElementById('start-btn');
  const setupDiv     = document.getElementById('setup');
  const scannerDiv   = document.getElementById('scanner');
  const bottomCtrl   = document.getElementById('bottom-controls');
  const video        = document.getElementById('video');
  const canvas       = document.getElementById('canvas');
  const statusBar    = document.getElementById('status-bar');
  const detectedDiv  = document.getElementById('detected-numbers');
  const targetDisp   = document.getElementById('target-display');
  const stopBtn      = document.getElementById('stop-btn');
  const foundOverlay = document.getElementById('found-overlay');
  const foundNumber  = document.getElementById('found-number');
  const dismissBtn   = document.getElementById('dismiss-btn');

  let targetNumber = '';
  let worker = null;
  let stream = null;
  let scanning = false;
  let scanLoop = null;
  let alertCooldown = false;

  targetInput.addEventListener('input', () => {
    targetInput.value = targetInput.value.replace(/\D/g, '').slice(0, 6);
    startBtn.disabled = targetInput.value.length !== 6;
  });

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
  }

  function vibrate() {
    if (navigator.vibrate) {
      navigator.vibrate([300, 100, 300, 100, 300]);
    }
  }

  startBtn.addEventListener('click', async () => {
    targetNumber = targetInput.value.trim();
    if (targetNumber.length !== 6) return;
    targetDisp.textContent = targetNumber;

    startBtn.disabled = true;
    startBtn.textContent = 'STARTING...';

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();
    } catch(e) {
      alert('Camera access denied. Please allow camera permissions and try again.');
      startBtn.disabled = false;
      startBtn.textContent = 'START SCANNING';
      return;
    }

    setupDiv.style.display = 'none';
    scannerDiv.style.display = 'flex';
    bottomCtrl.style.display = 'flex';

    statusBar.textContent = 'LOADING OCR ENGINE...';

    worker = await Tesseract.createWorker('eng', 1, {
      logger: () => {}
    });

    await worker.setParameters({
      tessedit_char_whitelist: '0123456789',
      tessedit_pageseg_mode: '7',
    });

    statusBar.textContent = 'SCANNING — AIM CAMERA AT TRAILER NUMBERS';
    statusBar.className = 'reading';
    scanning = true;
    runScan();
  });

  async function runScan() {
    if (!scanning) return;

    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // Crop center strip where numbers likely appear
    const cropH = Math.floor(canvas.height * 0.4);
    const cropY = Math.floor(canvas.height * 0.3);
    const imageData = ctx.getImageData(0, cropY, canvas.width, cropH);

    // Put cropped data into a temporary canvas
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width  = canvas.width;
    tmpCanvas.height = cropH;
    tmpCanvas.getContext('2d').putImageData(imageData, 0, 0);

    try {
      const { data: { text } } = await worker.recognize(tmpCanvas);
      const numbers = extractSixDigitNumbers(text);
      updateDetected(numbers);
    } catch(e) {
      // silently continue
    }

    if (scanning) {
      scanLoop = setTimeout(runScan, 800);
    }
  }

  function extractSixDigitNumbers(text) {
    // Pull out all runs of 4–8 digits, keep 6-digit ones as priority
    const raw = text.replace(/[^0-9]/g, ' ');
    const tokens = raw.split(/\s+/).filter(t => t.length >= 4 && t.length <= 8);
    return [...new Set(tokens)];
  }

  function updateDetected(numbers) {
    if (numbers.length === 0) {
      detectedDiv.innerHTML = '<span style="color:#444">No numbers detected</span>';
      statusBar.textContent  = 'SCANNING — AIM CAMERA AT TRAILER NUMBERS';
      statusBar.className    = 'reading';
      return;
    }

    detectedDiv.innerHTML = '';
    let found = false;

    numbers.forEach(n => {
      const el = document.createElement('span');
      el.className = 'detected-num';
      el.textContent = n;

      // Fuzzy: check if target appears anywhere in detected string or vice versa
      if (n === targetNumber || n.includes(targetNumber) || targetNumber.includes(n)) {
        el.classList.add('match');
        found = true;
      }
      detectedDiv.appendChild(el);
    });

    if (found && !alertCooldown) {
      alertCooldown = true;
      triggerFound();
      setTimeout(() => { alertCooldown = false; }, 5000);
    }

    statusBar.textContent = found ? `✓ MATCH DETECTED: ${targetNumber}` : `READING: ${numbers.join('  ')}`;
    statusBar.className   = found ? 'found' : 'reading';
  }

  function triggerFound() {
    playBeep();
    vibrate();
    foundNumber.textContent = targetNumber;
    foundOverlay.style.display = 'flex';
  }

  dismissBtn.addEventListener('click', () => {
    foundOverlay.style.display = 'none';
  });

  stopBtn.addEventListener('click', stopScanning);

  function stopScanning() {
    scanning = false;
    clearTimeout(scanLoop);
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (worker) {
      worker.terminate();
      worker = null;
    }
    scannerDiv.style.display = 'none';
    bottomCtrl.style.display = 'none';
    foundOverlay.style.display = 'none';
    setupDiv.style.display = 'flex';
    startBtn.disabled = false;
    startBtn.textContent = 'START SCANNING';
    detectedDiv.innerHTML = '<span style="color:#444">No numbers detected yet</span>';
  }
</script>
</body>
</html>
